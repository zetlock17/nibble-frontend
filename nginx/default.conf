server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://149.154.68.183/api/;
        proxy_cookie_path /auth /api/auth;
        set $backend_origin $http_origin;
        # Translate same-origin requests only; foreign origins still reach backend validation.
        if ($http_origin = "$scheme://$http_host") {
            set $backend_origin http://149.154.68.183;
        }
        proxy_set_header Origin $backend_origin;
        proxy_set_header Host $proxy_host;
        proxy_connect_timeout 10s;
        proxy_read_timeout 25s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
