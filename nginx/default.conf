server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://149.154.68.183/api/;
        proxy_set_header Host $proxy_host;
        proxy_connect_timeout 10s;
        proxy_read_timeout 25s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
